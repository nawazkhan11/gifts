<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Little Surprise For You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <main class="stage">
      <p class="brand">For You</p>
      <h1 class="headline" id="headline">Someone left you a gift</h1>
      <p class="subline" id="subline">
        Allow location so we can make this moment feel a little more magical.
      </p>

      <div class="gift-scene" id="giftScene">
        <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open your gift">
          <div class="gift-shadow"></div>
          <div class="lid" id="lid">
            <div class="bow">
              <span class="bow-left"></span>
              <span class="bow-right"></span>
              <span class="bow-knot"></span>
            </div>
          </div>
          <div class="box">
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
          </div>
          <div class="glow-ring"></div>
        </div>
        <p class="hint" id="hint">Tap the gift to open</p>
      </div>

      <section class="message-card" id="messageCard" hidden>
        <p class="message-label">Your surprise note</p>
        <p class="message-text" id="messageText"></p>
        <button type="button" class="next-btn" id="nextBtn">Another wish</button>
      </section>
    </main>

    <div class="permission-toast" id="permissionToast" hidden>
      <p>We need your location for a personal surprise.</p>
      <button type="button" id="retryLocation">Allow location</button>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
